<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>8-Subject Frequency Counter</title><style>body{font-family:Arial;background:#eef2f8;color:#243047;margin:0}.app{max-width:900px;margin:auto;padding:20px}.card{background:white;padding:24px;border-radius:22px;margin:16px 0}select,input,button{padding:14px;border-radius:12px;border:1px solid #ccd5e0;font-size:16px;width:100%;box-sizing:border-box;margin:6px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.correct{background:#dff1e5}.incorrect{background:#fae2de}.count{font-size:48px;font-weight:bold;display:block}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:center}.scroll{max-height:400px;overflow:auto}</style></head><body><div class="app"><div class="card"><h1>📊 8-Subject Frequency Counter</h1><label>Group</label><select id="group"><option>Group 1</option><option>Group 2</option><option>Group 3</option><option>Group 4</option><option>Group 5</option></select><label>Number of Students</label><input id="students" type="number"><label>Subject</label><select id="subject"></select></div><div class="card"><h2 id="title"></h2><h1 style="text-align:center">ITEM <span id="item">1</span> / 40</h1><div class="grid"><button class="correct" id="correct">✓ CORRECT<span class="count" id="c">0</span></button><button class="incorrect" id="incorrect">✕ INCORRECT<span class="count" id="i">0</span></button></div><div class="grid"><button id="undo">↩ Undo</button><button id="reset">↻ Reset Item</button></div><button id="next">NEXT ITEM →</button></div><div class="card"><h2>📋 Subject Summary</h2><div class="scroll"><table><thead><tr><th>Item</th><th>Correct</th><th>Incorrect</th></tr></thead><tbody id="summary"></tbody></table></div></div><div class="card"><h2>📦 Group Data</h2><button id="export">EXPORT ALL 8 SUBJECTS</button><input id="import" type="file" multiple accept=".json"><p id="status">No group files imported.</p></div><div class="card"><h2>👩‍🏫 Consolidated Results</h2><div class="scroll"><table><thead><tr><th>Item</th><th>Correct</th><th>Incorrect</th><th>Total</th></tr></thead><tbody id="report"></tbody></table></div></div></div><script src="app.js"></script></body></html>
